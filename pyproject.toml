[build-system]
requires = ["setuptools>=78,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-rampup-coach"
version = "0.1.2a1"
description = "Snapshot-grounded technical reading paths and exercises with human mentoring"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{name = "RUSSELL PHILIP SMITHSON"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["rampup*"]
